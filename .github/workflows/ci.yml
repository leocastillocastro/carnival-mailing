name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carnival
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: carnival_mailing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carnival -d carnival_mailing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    # No .env files exist in CI; dotenv never overrides variables that are
    # already set, so these are what every package sees.
    env:
      DATABASE_URL: postgres://carnival:ci-only-password@localhost:5432/carnival_mailing
      REDIS_URL: redis://localhost:6379
      # apps/worker's processCampaignSend test imports src/env.ts, which
      # requires it; nothing is actually sent.
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the version from "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @carnival/db migrate
      - run: pnpm test
